<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c6fff" />
      <stop offset="100%" stop-color="#8c52ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur" />
      <feFlood flood-color="#4c6fff" flood-opacity="0.4" result="glowColor" />
      <feComposite in="glowColor" in2="blur" operator="in" result="softGlow" />
      <feMerge>
        <feMergeNode in="softGlow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="96" cy="96" r="88" fill="url(#grad)" filter="url(#glow)" />
  
  <!-- Sun -->
  <circle cx="96" cy="80" r="24" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
  <line x1="96" y1="48" x2="96" y2="60" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
  <line x1="96" y1="100" x2="96" y2="112" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
  <line x1="64" y1="80" x2="76" y2="80" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
  <line x1="116" y1="80" x2="128" y2="80" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
  <line x1="74" y1="58" x2="82" y2="66" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
  <line x1="110" y1="58" x2="102" y2="66" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
  <line x1="74" y1="102" x2="82" y2="94" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
  <line x1="110" y1="102" x2="102" y2="94" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
  
  <!-- Cloud -->
  <path d="M130 120c-15-20-40-20-55 0-10-15-30-15-40 0" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="96" cy="112" r="20" fill="#ffffff" />
  <circle cx="120" cy="104" r="16" fill="#ffffff" />
  <circle cx="72" cy="104" r="12" fill="#ffffff" />
  
  <!-- App Name Initial -->
  <text x="96" y="165" font-family="Arial, sans-serif" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">WF</text>
</svg>