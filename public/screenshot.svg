<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c6fff" />
      <stop offset="100%" stop-color="#8c52ff" />
    </linearGradient>
    <linearGradient id="card-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0.95" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" />
      <feOffset dx="0" dy="4" result="offsetblur" />
      <feFlood flood-color="#000000" flood-opacity="0.15" />
      <feComposite in2="offsetblur" operator="in" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-gradient)" />
  
  <!-- App Container -->
  <rect x="150" y="80" width="900" height="470" rx="24" fill="url(#card-gradient)" filter="url(#shadow)" />
  
  <!-- Header Bar -->
  <rect x="180" y="110" width="840" height="60" rx="16" fill="#edf2f7" />
  <circle cx="220" cy="140" r="16" fill="#4c6fff" />
  <circle cx="265" cy="140" r="16" fill="#dd6b20" />
  <circle cx="310" cy="140" r="16" fill="#38a169" />
  
  <!-- Search Bar -->
  <rect x="400" y="120" width="500" height="40" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
  <text x="420" y="147" font-family="Arial, sans-serif" font-size="16" fill="#718096">Search location...</text>
  
  <!-- Theme Toggle -->
  <circle cx="950" cy="140" r="14" fill="#f6ad55" />
  
  <!-- Current Weather Card -->
  <rect x="200" y="200" width="350" height="280" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  
  <!-- Location -->
  <text x="230" y="240" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#1a202c">San Francisco, CA</text>
  <text x="230" y="275" font-family="Arial, sans-serif" font-size="18" fill="#4a5568">Clear Sky • 10:42 AM</text>
  
  <!-- Temperature -->
  <text x="230" y="350" font-family="Arial, sans-serif" font-size="72" font-weight="700" fill="#1a202c">72°</text>
  <text x="310" y="350" font-family="Arial, sans-serif" font-size="24" fill="#4a5568">F</text>
  

<!-- Weather Icon (Sun) -->
<circle cx="480" cy="320" r="40" fill="#f6ad55" opacity="0.2" />
<circle cx="480" cy="320" r="28" fill="#f6ad55" />
<!-- Top ray -->
<line x1="480" y1="270" x2="480" y2="285" stroke="#f6ad55" stroke-width="3" stroke-linecap="round" />
<!-- Bottom ray -->
<line x1="480" y1="355" x2="480" y2="370" stroke="#f6ad55" stroke-width="3" stroke-linecap="round" />
<!-- Left ray -->
<line x1="430" y1="320" x2="445" y2="320" stroke="#f6ad55" stroke-width="3" stroke-linecap="round" />
<!-- Right ray -->
<line x1="515" y1="320" x2="530" y2="320" stroke="#f6ad55" stroke-width="3" stroke-linecap="round" />
<!-- Top-left diagonal ray -->
<line x1="445" y1="285" x2="455" y2="295" stroke="#f6ad55" stroke-width="3" stroke-linecap="round" />
<!-- Top-right diagonal ray -->
<line x1="515" y1="285" x2="505" y2="295" stroke="#f6ad55" stroke-width="3" stroke-linecap="round" />
<!-- Bottom-left diagonal ray -->
<line x1="445" y1="355" x2="455" y2="345" stroke="#f6ad55" stroke-width="3" stroke-linecap="round" />
<!-- Bottom-right diagonal ray -->
<line x1="515" y1="355" x2="505" y2="345" stroke="#f6ad55" stroke-width="3" stroke-linecap="round" />

  <!-- Details -->
  <g transform="translate(230, 370)">
    <text font-family="Arial, sans-serif" font-size="14" fill="#4a5568">
      <tspan x="0" dy="1.5em">Feels Like: 70°</tspan>
      <tspan x="0" dy="1.5em">Humidity: 65%</tspan>
      <tspan x="0" dy="1.5em">Wind: 8 mph NW</tspan>
      <tspan x="0" dy="1.5em">UV Index: 5 (Moderate)</tspan>
    </text>
  </g>
  
  <!-- Forecast Cards - FIXED LAYOUT -->
  <g transform="translate(580, 190)">
    <!-- Card 1: Today -->
    <rect x="0" y="0" width="130" height="110" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <text x="65" y="22" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#4a5568" font-weight="500">Today</text>
    <circle cx="65" cy="50" r="16" fill="#f6ad55" />
    <text x="65" y="85" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#1a202c">78°</text>
    <text x="65" y="102" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#4a5568">65°</text>
    
    <!-- Card 2: Mon -->
    <rect x="0" y="124" width="130" height="110" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <text x="65" y="147" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#4a5568" font-weight="500">Mon</text>
    <circle cx="65" cy="175" r="16" fill="#a0aec0" opacity="0.85" />
    <text x="65" y="210" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#1a202c">72°</text>
    <text x="65" y="227" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#4a5568">58°</text>
    
    <!-- Card 3: Tue -->
    <rect x="0" y="249" width="130" height="110" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <text x="65" y="272" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#4a5568" font-weight="500">Tue</text>
    <path d="M52 290 Q65 282 78 290 L78 305 Q65 313 52 305 Z" fill="#4299e1" opacity="0.9" />
    <circle cx="65" cy="298" r="7" fill="#4299e1" />
    <text x="65" y="335" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#1a202c">68°</text>
    <text x="65" y="352" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#4a5568">55°</text>
  </g>
  
  <!-- Favorites Bar -->
  <rect x="200" y="500" width="800" height="50" rx="20" fill="#edf2f7" />
  <circle cx="230" cy="525" r="10" fill="#dd6b20" />
  <text x="250" y="530" font-family="Arial, sans-serif" font-size="14" fill="#1a202c">Favorites</text>
  <text x="350" y="530" font-family="Arial, sans-serif" font-size="14" fill="#4a5568">• New York • Tokyo • Paris • London</text>
  
  <!-- App Title -->
  <text x="600" y="50" font-family="Arial, sans-serif" font-size="36" font-weight="800" text-anchor="middle" fill="#ffffff">WeatherFlow</text>
  <text x="600" y="72" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#e2e8f0">Professional Vanilla JavaScript Weather Application</text>
  
  <!-- Badges -->
  <g transform="translate(950, 560)">
    <rect x="0" y="0" width="180" height="30" rx="15" fill="#1a202c" opacity="0.85" />
    <text x="90" y="20" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#f7fafc">PWA • Offline Ready</text>
  </g>
  
  <g transform="translate(750, 560)">
    <rect x="0" y="0" width="180" height="30" rx="15" fill="#1a202c" opacity="0.85" />
    <text x="90" y="20" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#f7fafc">WCAG 2.1 AA Compliant</text>
  </g>
</svg>