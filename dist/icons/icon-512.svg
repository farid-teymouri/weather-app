<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c6fff" />
      <stop offset="100%" stop-color="#8c52ff" />
    </linearGradient>
    <filter id="glow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="blur" />
      <feFlood flood-color="#4c6fff" flood-opacity="0.5" result="glowColor" />
      <feComposite in="glowColor" in2="blur" operator="in" result="softGlow" />
      <feMerge>
        <feMergeNode in="softGlow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#grad)" filter="url(#glow)" />
  
  <!-- Sun -->
  <circle cx="256" cy="210" r="64" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" />
  <line x1="256" y1="130" x2="256" y2="162" stroke="#ffffff" stroke-width="16" stroke-linecap="round" />
  <line x1="256" y1="258" x2="256" y2="290" stroke="#ffffff" stroke-width="16" stroke-linecap="round" />
  <line x1="170" y1="210" x2="202" y2="210" stroke="#ffffff" stroke-width="16" stroke-linecap="round" />
  <line x1="310" y1="210" x2="342" y2="210" stroke="#ffffff" stroke-width="16" stroke-linecap="round" />
  <line x1="196" y1="150" x2="218" y2="172" stroke="#ffffff" stroke-width="16" stroke-linecap="round" />
  <line x1="316" y1="150" x2="294" y2="172" stroke="#ffffff" stroke-width="16" stroke-linecap="round" />
  <line x1="196" y1="270" x2="218" y2="248" stroke="#ffffff" stroke-width="16" stroke-linecap="round" />
  <line x1="316" y1="270" x2="294" y2="248" stroke="#ffffff" stroke-width="16" stroke-linecap="round" />
  
  <!-- Cloud -->
  <path d="M350 330c-40-55-110-55-150 0-28-42-82-42-110 0" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="256" cy="308" r="54" fill="#ffffff" />
  <circle cx="320" cy="286" r="43" fill="#ffffff" />
  <circle cx="192" cy="286" r="32" fill="#ffffff" />
  
  <!-- App Name -->
  <text x="256" y="430" font-family="Arial, sans-serif" font-size="88" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-2">WeatherFlow</text>
</svg>